name: PORT Chronomorph author qualification
on:
  pull_request:
    paths:
      - 'instruments/fm1-ports/chronomorph/**'
      - '.github/workflows/port-chronomorph.yml'
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: instruments/fm1-ports/chronomorph
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Native execution and sanitizers
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          mkdir media san
          g++ -std=c++17 -O2 -Wall -Wextra -Werror replay.cpp -o replay
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pthread runtime_test.cpp -o runtime-test
          ./replay media
          ./runtime-test
          clang++ -std=c++17 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined replay.cpp -o replay-san
          clang++ -std=c++17 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -pthread runtime_test.cpp -o runtime-san
          ./replay-san san
          ./runtime-san
          diff -qr media san
          sha256sum media/* > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: chronomorph-native-Linux
          path: |
            instruments/fm1-ports/chronomorph/media/
            instruments/fm1-ports/chronomorph/SHA256SUMS.txt
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: instruments/fm1-ports/chronomorph
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
      - shell: msys2 {0}
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          mkdir -p "owner package/media"
          g++ -std=c++17 -O2 -Wall -Wextra -Werror replay.cpp -o "owner package/replay.exe" -static
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pthread runtime_test.cpp -o "owner package/runtime-test.exe" -static
          g++ -std=c++17 -O2 windows.cpp -o "owner package/Chronomorph.exe" -pthread -lwinmm -lgdi32 -luser32 -static
          cp core.hpp runtime.hpp runtime_test.cpp replay.cpp windows.cpp README.md "owner package/"
          git rev-parse HEAD HEAD^{tree} > "owner package/SOURCE.txt"
          g++ --version > "owner package/TOOLCHAIN.txt"
          "owner package/replay.exe" "owner package/media"
          "owner package/runtime-test.exe"
          (cd "owner package" && sha256sum *.exe *.hpp *.cpp SOURCE.txt TOOLCHAIN.txt README.md media/* > SHA256SUMS.txt)
      - shell: pwsh
        run: |
          Compress-Archive -Path "owner package/*" -DestinationPath Chronomorph.zip
          Expand-Archive Chronomorph.zip -DestinationPath "extracted audition"
          & "./extracted audition/replay.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "./extracted audition/runtime-test.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "./extracted audition/Chronomorph.exe" --smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash Chronomorph.zip
      - uses: actions/upload-artifact@v4
        with:
          name: chronomorph-windows
          path: instruments/fm1-ports/chronomorph/Chronomorph.zip
