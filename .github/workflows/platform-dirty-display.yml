name: PLATFORM P6 dirty display target qualification
on:
  pull_request:
    paths:
      - 'platform/row-batch/dirty_display*'
      - 'platform/row-batch/prepare_dirty.py'
      - '.github/workflows/platform-dirty-display.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  target:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: c0a866a71ecf0a6be958a04f9870b92d0a7fe069
          path: consumer
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          set -o pipefail
          mkdir -p target-receipt
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -I consumer/instruments/chronogrid platform/row-batch/dirty_display_test.cpp -o combined
          ./combined | tee target-receipt/native.txt
          clang++ -std=c++17 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -I consumer/instruments/chronogrid platform/row-batch/dirty_display_test.cpp -o combined-san
          ./combined-san | tee target-receipt/sanitizer.txt
          python platform/row-batch/prepare_dirty.py consumer
      - run: python -m pip install platformio==6.1.18 intelhex==2.3.0
      - run: |
          set -o pipefail
          git rev-parse HEAD > target-receipt/platform-source.txt
          git -C consumer rev-parse HEAD > target-receipt/consumer-source.txt
          git -C consumer diff > target-receipt/adapter.patch
          cp platform/row-batch/{dirty_display,dirty_grid,typed_strip}.hpp target-receipt/
          pio run -d consumer/instruments/chronogrid/firmware -e cyd-chronogrid 2>&1 | tee target-receipt/build.log
          pio pkg list -d consumer/instruments/chronogrid/firmware > target-receipt/toolchain.txt
          cp consumer/instruments/chronogrid/firmware/.pio/build/cyd-chronogrid/firmware.map target-receipt/
          sha256sum consumer/instruments/chronogrid/firmware/.pio/build/cyd-chronogrid/firmware.elf > target-receipt/elf-sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-p6-target-receipt-not-installable
          path: target-receipt/
          if-no-files-found: warn
