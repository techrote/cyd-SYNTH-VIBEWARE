name: QA batch 007 independent Chronomorph and target refresh
on:
  pull_request:
    paths:
      - 'qualification/replay007.py'
      - '.github/workflows/qa-batch-007.yml'
      - 'qualification/panic_matrix.cpp'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  independent-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/checkout@v4
        with:
          ref: e57f1bc20de0924ec976ff6abce7b5cae903f1a2
          path: chrono-source
      - name: Independently verify and run M4 archive
        run: python qualification/replay007.py chrono-source 'independent Chronomorph replay'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Clean Chronomorph native and graphical build
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd chrono-source/instruments/fm1-ports/chronomorph
          mkdir -p 'clean media'
          g++ -std=c++17 -O2 -Wall -Wextra -Werror replay.cpp -o replay.exe -static
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pthread runtime_test.cpp -o runtime-test.exe -static
          g++ -std=c++17 -O2 -Wall -Wextra -Werror target_gate_test.cpp -o gate-test.exe -static
          g++ -std=c++17 -O2 windows.cpp -o Chronomorph.exe -pthread -lwinmm -lgdi32 -luser32 -static
          ./replay.exe 'clean media'
          ./runtime-test.exe
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -I. ../../../../qualification/panic_matrix.cpp -o qa-panic.exe -static
          ./qa-panic.exe
          ./gate-test.exe
          ./Chronomorph.exe --smoke
      - name: Compare clean Chronomorph PCM and frames
        run: python qualification/replay006.py compare 'independent Chronomorph replay/extracted package/media' 'chrono-source/instruments/fm1-ports/chronomorph/clean media'
  independent-target:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 775d9397b11f944344d1aefaf216c6451b994d36
          path: integrated
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: c0a866a71ecf0a6be958a04f9870b92d0a7fe069
          path: grid
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install platformio==6.1.18 intelhex==2.3.0
      - name: Verify clean source pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C integrated rev-parse HEAD)" = 775d9397b11f944344d1aefaf216c6451b994d36
          test "$(git -C integrated rev-parse 'HEAD^{tree}')" = 7f6a85590f2f733e6f7373068bfd58e6405f7352
          test "$(git -C grid rev-parse HEAD)" = c0a866a71ecf0a6be958a04f9870b92d0a7fe069
          test "$(git -C grid rev-parse 'HEAD^{tree}')" = 38ef03e00867b92a0b187ad19888057ce9383630
          test -z "$(git -C integrated status --porcelain)"
          test -z "$(git -C grid status --porcelain)"
      - name: Independently compile and link frozen standalone profiles
        shell: bash
        run: |
          set -euo pipefail
          mkdir qa-target-receipts
          pio system info > qa-target-receipts/system.txt
          python -c 'import intelhex; from importlib.metadata import version; assert version("intelhex") == "2.3.0"; print(version("intelhex"))' > qa-target-receipts/intelhex-version.txt
          build() {
            local repo="$1" project="$2" env="$3"
            local dir="$repo/$project" out="qa-target-receipts/$env"
            mkdir "$out"
            export PLATFORMIO_CORE_DIR="$RUNNER_TEMP/qa-pio-$env"
            test ! -e "$PLATFORMIO_CORE_DIR"
            printf '%s\n' "$PLATFORMIO_CORE_DIR" > "$out/core-dir.txt"
            git -C "$repo" rev-parse HEAD > "$out/source-commit.txt"
            git -C "$repo" rev-parse 'HEAD^{tree}' > "$out/source-tree.txt"
            cp "$dir/platformio.ini" "$out/platformio.ini"
            pio run -d "$dir" -e "$env" 2>&1 | tee "$out/build.txt"
            pio pkg list -d "$dir" -e "$env" > "$out/toolchain.txt"
            local builddir="$dir/.pio/build/$env"
            test -s "$builddir/firmware.map"
            test -s "$builddir/firmware.elf"
            cp "$builddir/firmware.map" "$out/firmware.map"
            sha256sum "$builddir/firmware.elf" > "$out/elf-sha256.txt"
            find "$dir/.pio/libdeps/$env" -type f \( -iname 'LICENSE*' -o -iname 'COPYING*' -o -iname 'NOTICE*' \) -print0 | sort -z | xargs -0 -r sha256sum > "$out/dependency-notice-hashes.txt"
            (cd "$out" && sha256sum *.txt platformio.ini firmware.map > manifest.sha256 && sha256sum -c manifest.sha256)
            echo "PASS target compile/link $env (not physical execution)"
          }
          failed=0
          run_build() {
            local env="$3" status
            # A fresh shell preserves errexit inside build even when the caller handles failure.
            if bash -euo pipefail -c "$(declare -f build); build \"\$@\"" qa-build "$@"; then
              status=PASS
            else
              status=FAIL
              failed=1
            fi
            printf '%s\t%s\n' "$env" "$status" | tee -a qa-target-receipts/profile-status.tsv
          }
          run_build integrated instruments/phasespace/firmware cyd-phasespace
          run_build integrated instruments/fm1-ports/xenoresonator cyd-port-xeno
          run_build grid instruments/chronogrid/firmware cyd-chronogrid
          run_build integrated instruments/fm1-ports/chronomorph cyd-port-chrono
          exit "$failed"
      - name: Preserve only non-installable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-batch-007-target-receipts-no-firmware
          path: qa-target-receipts/
          if-no-files-found: warn
