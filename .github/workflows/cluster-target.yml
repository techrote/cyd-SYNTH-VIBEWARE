name: Cluster ESP-NOW target builds
on:
  pull_request:
    paths:
      - 'cluster/**'
      - '.github/workflows/cluster-target.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  target:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [cyd-coordinator, s3-worker, c3-worker, cyd-worker]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install platformio==6.1.18
      - run: pio run -d cluster/firmware -e ${{ matrix.profile }}
      - name: Record build evidence (no flash)
        shell: bash
        run: |
          set -euo pipefail
          profile='${{ matrix.profile }}'
          src="cluster/firmware/.pio/build/$profile"
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-commit.txt
          git rev-parse HEAD^{tree} > evidence/source-tree.txt
          pio pkg list -d cluster/firmware -e "$profile" > evidence/packages.txt
          cp "$src/firmware.elf" "$src/firmware.bin" "$src/firmware.map" evidence/
          printf '%s\n' "$profile" > evidence/profile.txt
          (cd evidence && sha256sum firmware.elf firmware.bin firmware.map > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: cluster-target-${{ matrix.profile }}-UNAPPROVED
          path: evidence/
          if-no-files-found: error
