name: PLATFORM strip reference qualification
on:
  pull_request:
    paths:
      - 'platform/reference-strip/**'
      - '.github/workflows/platform-strip.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 072ede0c2909836f90639d2112ea3786d770795d
          path: consumer
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python platform/reference-strip/prepare.py consumer
      - run: cmake -S consumer/instruments/phasespace -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure
      - if: runner.os == 'Linux'
        run: |
          build/platform_strip_test bench | tee strip-benchmark.txt
          clang++ -std=c++17 -O1 -g -fsanitize=address,undefined consumer/instruments/phasespace/strip_test.cpp -o strip-sanitized
          ./strip-sanitized
          clang++ -std=c++17 -O1 -g -fsanitize=address,undefined consumer/instruments/phasespace/topology_test.cpp -o topology-sanitized
          ./topology-sanitized
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory 'strip package' | Out-Null
          Copy-Item build/Release/phasespace.exe 'strip package'
          Copy-Item build/Release/phasespace_replay.exe 'strip package'
          Copy-Item build/Release/platform_strip_test.exe 'strip package'
          Copy-Item build/Release/platform_topology_test.exe 'strip package'
          git rev-parse HEAD | Set-Content 'strip package/platform-source.txt'
          git -C consumer rev-parse HEAD | Set-Content 'strip package/consumer-base.txt'
          Copy-Item platform/reference-strip/README.md 'strip package'
          Copy-Item platform/reference-strip/P2.md 'strip package'
          Compress-Archive -Path 'strip package/*' -DestinationPath platform-strip-windows.zip
          Expand-Archive platform-strip-windows.zip 'extracted strip'
          & './extracted strip/platform_strip_test.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Pixel replay failed' }
          & './extracted strip/platform_topology_test.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Topology replay failed' }
          & './extracted strip/phasespace_replay.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Core replay failed' }
          & './extracted strip/phasespace.exe' --smoke
          if ($LASTEXITCODE -ne 0) { throw 'Graphical smoke failed' }
          (Get-FileHash platform-strip-windows.zip -Algorithm SHA256).Hash | Set-Content platform-strip-windows.sha256
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: platform-strip-m4-windows-candidate
          path: |
            platform-strip-windows.zip
            platform-strip-windows.sha256
          if-no-files-found: error
  target:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 072ede0c2909836f90639d2112ea3786d770795d
          path: consumer
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python platform/reference-strip/prepare.py consumer
      - run: python -m pip install platformio==6.1.18
      - run: pio run -d consumer/instruments/phasespace/firmware -e cyd-phasespace
      - run: |
          mkdir target-receipt
          pio pkg list -d consumer/instruments/phasespace/firmware > target-receipt/toolchain.txt
          git rev-parse HEAD > target-receipt/platform-source.txt
          git -C consumer rev-parse HEAD > target-receipt/consumer-base.txt
          git -C consumer diff > target-receipt/adapter.patch
          cp consumer/instruments/phasespace/firmware/.pio/build/cyd-phasespace/firmware.map target-receipt/
          sha256sum consumer/instruments/phasespace/firmware/.pio/build/cyd-phasespace/firmware.elf > target-receipt/elf-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: platform-strip-m4-target-map-not-installable
          path: target-receipt/
          if-no-files-found: error
