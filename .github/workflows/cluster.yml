name: Cluster native qualification
on:
  pull_request:
    paths:
      - 'cluster/**'
      - '.github/workflows/cluster.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S cluster -B build/cluster -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/cluster --config Release
      - run: ctest --test-dir build/cluster -C Release --output-on-failure -V
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = 'cluster-package'
          New-Item -ItemType Directory -Path $pkg | Out-Null
          Copy-Item build/cluster/Release/cluster_native.exe $pkg
          Copy-Item build/cluster/Release/cluster_udp.exe $pkg
          Copy-Item build/cluster/Release/cluster_field.exe $pkg
          Copy-Item build/cluster/Release/cluster_field_replay.exe $pkg
          Copy-Item build/cluster/Release/cluster_dual_test.exe $pkg
          Copy-Item build/cluster/Release/cluster_dual_udp.exe $pkg
          Copy-Item build/cluster/Release/cluster_multi_test.exe $pkg
          Copy-Item build/cluster/Release/cluster_multi_field_test.exe $pkg
          Copy-Item build/cluster/Release/cluster_multi_field.exe $pkg
          Copy-Item cluster/multi_field_smoke.py $pkg
          Copy-Item cluster/bench_capture.py $pkg
          Copy-Item cluster/bench_capture_test.py $pkg
          Copy-Item build/cluster/Release/cluster_bench_test.exe $pkg
          Copy-Item build/cluster/Release/cluster_lan_test.exe $pkg
          Copy-Item build/cluster/Release/cluster_multi_udp.exe $pkg
          Copy-Item cluster/multi_udp_test.py $pkg
          Copy-Item cluster/dual_udp_test.py $pkg
          Copy-Item cluster/udp_test.py $pkg
          Copy-Item cluster/field_udp_smoke.py $pkg
          & "$pkg/cluster_field_replay.exe" "$pkg/field-demo"
          if ($LASTEXITCODE -ne 0) { throw 'Field replay/media failed' }
          & "$pkg/cluster_dual_test.exe" "$pkg/dual-demo.wav"
          if ($LASTEXITCODE -ne 0) { throw 'Dual replay/media failed' }
          Copy-Item cluster/README.md $pkg
          git rev-parse HEAD | Set-Content "$pkg/source-commit.txt"
          Compress-Archive -Path "$pkg/*" -DestinationPath cluster-native-windows.zip
          Expand-Archive cluster-native-windows.zip 'extracted cluster'
          & './extracted cluster/cluster_native.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Extracted replay failed' }
          python './extracted cluster/udp_test.py' './extracted cluster/cluster_udp.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Extracted UDP loopback failed' }
          & './extracted cluster/cluster_field_replay.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Extracted field replay failed' }
          & './extracted cluster/cluster_field.exe' --smoke
          if ($LASTEXITCODE -ne 0) { throw 'Extracted GDI smoke failed' }
          python './extracted cluster/field_udp_smoke.py' './extracted cluster/cluster_udp.exe' './extracted cluster/cluster_field.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Extracted GDI UDP smoke failed' }
          & './extracted cluster/cluster_dual_test.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Extracted dual replay failed' }
          python './extracted cluster/dual_udp_test.py' './extracted cluster/cluster_dual_udp.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Extracted dual UDP failed' }
          & './extracted cluster/cluster_multi_test.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Extracted multi replay failed' }
          python './extracted cluster/multi_udp_test.py' './extracted cluster/cluster_multi_udp.exe' './extracted cluster/cluster_udp.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Extracted multi UDP failed' }
          & './extracted cluster/cluster_multi_field_test.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Extracted multi field replay failed' }
          & './extracted cluster/cluster_multi_field.exe' --smoke
          if ($LASTEXITCODE -ne 0) { throw 'Extracted multi field GDI smoke failed' }
          python './extracted cluster/multi_field_smoke.py' './extracted cluster/cluster_udp.exe' './extracted cluster/cluster_multi_field.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Extracted multi field GDI UDP failed' }
          & './extracted cluster/cluster_bench_test.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Extracted bench replay failed' }
          python './extracted cluster/bench_capture_test.py'
          if ($LASTEXITCODE -ne 0) { throw 'Extracted bench capture failed' }
          & './extracted cluster/cluster_lan_test.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Extracted LAN admission failed' }
          (Get-FileHash cluster-native-windows.zip -Algorithm SHA256).Hash | Set-Content cluster-native-windows.sha256
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: cluster-native-windows
          path: |
            cluster-native-windows.zip
            cluster-native-windows.sha256
          if-no-files-found: error
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer cluster/native.cpp -o cluster_sanitized
      - run: ./cluster_sanitized
        env:
          UBSAN_OPTIONS: halt_on_error=1
          ASAN_OPTIONS: halt_on_error=1

      - run: g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer cluster/field_replay.cpp -o field_sanitized
      - run: ./field_sanitized
        env:
          UBSAN_OPTIONS: halt_on_error=1
          ASAN_OPTIONS: halt_on_error=1

      - run: g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer cluster/dual_test.cpp -o dual_sanitized
      - run: ./dual_sanitized
        env:
          UBSAN_OPTIONS: halt_on_error=1
          ASAN_OPTIONS: halt_on_error=1

      - run: g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer cluster/multi_test.cpp -o multi_sanitized
      - run: ./multi_sanitized
        env:
          UBSAN_OPTIONS: halt_on_error=1
          ASAN_OPTIONS: halt_on_error=1

      - run: g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer cluster/multi_field_test.cpp -o multi_field_sanitized
      - run: ./multi_field_sanitized
        env:
          UBSAN_OPTIONS: halt_on_error=1
          ASAN_OPTIONS: halt_on_error=1

      - run: g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer cluster/bench_test.cpp -o bench_sanitized
      - run: ./bench_sanitized
        env:
          UBSAN_OPTIONS: halt_on_error=1
          ASAN_OPTIONS: halt_on_error=1

      - run: g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer cluster/lan_test.cpp -o lan_sanitized
      - run: ./lan_sanitized
        env:
          UBSAN_OPTIONS: halt_on_error=1
          ASAN_OPTIONS: halt_on_error=1
