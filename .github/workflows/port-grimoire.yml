name: PORT Grimoire author qualification
on:
  pull_request:
    paths:
      - 'instruments/fm1-ports/grimoire/**'
      - '.github/workflows/port-grimoire.yml'
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: instruments/fm1-ports/grimoire
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Actual native and sanitizer replay
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          g++ -std=c++17 -O2 -Wall -Wextra -Werror replay.cpp -o replay
          ./replay "native media"
          g++ -std=c++17 -O2 -Wall -Wextra -Werror strip_test.cpp -o strip-test
          ./strip-test
          g++ -std=c++17 -O2 -Wall -Wextra -Werror touch_test.cpp -o touch-test
          ./touch-test
          clang++ -std=c++17 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all replay.cpp -o replay-san
          ./replay-san "sanitized media"
          clang++ -std=c++17 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all strip_test.cpp -o strip-san
          ./strip-san
          clang++ -std=c++17 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all touch_test.cpp -o touch-san
          ./touch-san
          diff -qr "native media" "sanitized media"
          (cd "native media" && sha256sum *.wav *.ppm) > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: grimoire-native-Linux
          path: |
            instruments/fm1-ports/grimoire/native media/
            instruments/fm1-ports/grimoire/SHA256SUMS.txt
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: instruments/fm1-ports/grimoire
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc diffutils
      - name: Verify exact checkout
        shell: pwsh
        run: |
          $head = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $head -ne "${{ github.event.pull_request.head.sha }}") { throw "Wrong source head" }
          $tree = git rev-parse 'HEAD^{tree}'
          if ($LASTEXITCODE -ne 0) { throw "Cannot resolve tree" }
          New-Item -ItemType Directory -Force "owner package/media" | Out-Null
          @($head, $tree) | Set-Content -Encoding ascii "owner package/SOURCE.txt"
      - name: Build exact source and stage
        shell: msys2 {0}
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -Wall -Wextra -Werror replay.cpp -o "owner package/replay.exe" -static
          g++ -std=c++17 -O2 -Wall -Wextra -Werror windows.cpp -o "owner package/Grimoire.exe" -lwinmm -lgdi32 -luser32 -static
          g++ -std=c++17 -O2 -Wall -Wextra -Werror strip_test.cpp -o "owner package/strip-test.exe" -static
          g++ -std=c++17 -O2 -Wall -Wextra -Werror touch_test.cpp -o "owner package/touch-test.exe" -static
          cp core.hpp strip.hpp touch.hpp replay.cpp strip_test.cpp touch_test.cpp windows.cpp README.md M2.md M3.md "owner package/"
          g++ --version > "owner package/TOOLCHAIN.txt"
          objdump -p "owner package/Grimoire.exe" | grep 'DLL Name:' > "owner package/IMPORTS.txt"
          if grep -Ei 'DLL Name: (libgcc|libstdc\+\+|libwinpthread)' "owner package/IMPORTS.txt"; then exit 1; fi
          "owner package/replay.exe" "owner package/media"
          (cd "owner package" && sha256sum *.exe *.hpp *.cpp *.md SOURCE.txt TOOLCHAIN.txt IMPORTS.txt media/* > SHA256SUMS.txt)
      - name: Archive and extract in spaced path
        shell: pwsh
        run: |
          Compress-Archive -Path 'owner package/*' -DestinationPath 'Grimoire-Windows.zip'
          Expand-Archive -Path 'Grimoire-Windows.zip' -DestinationPath 'fresh extracted package'
          (Get-FileHash -Algorithm SHA256 'Grimoire-Windows.zip').Hash | Set-Content 'Grimoire-Windows.sha256'
      - name: Verify extracted package and actual graphical replay
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd "fresh extracted package"
          sha256sum -c SHA256SUMS.txt
          ./replay.exe "reproduced media"
          diff -qr media "reproduced media"
          ./strip-test.exe
          ./touch-test.exe
          ./Grimoire.exe --smoke
      - uses: actions/upload-artifact@v4
        with:
          name: grimoire-Windows
          path: |
            instruments/fm1-ports/grimoire/Grimoire-Windows.zip
            instruments/fm1-ports/grimoire/Grimoire-Windows.sha256
          if-no-files-found: error
