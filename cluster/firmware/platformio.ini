[platformio]
default_envs = cyd-coordinator, s3-worker, c3-worker, cyd-worker

[env]
platform = espressif32 @ 6.10.0
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17

[env:cyd-coordinator]
board = esp32dev
build_flags = ${env.build_flags} -DCLUSTER_COORDINATOR=1

[env:s3-worker]
board = esp32-s3-devkitc-1
build_flags = ${env.build_flags} -DCLUSTER_COORDINATOR=0

[env:c3-worker]
board = esp32-c3-devkitm-1
build_flags = ${env.build_flags} -DCLUSTER_COORDINATOR=0

[env:cyd-worker]
board = esp32dev
build_flags = ${env.build_flags} -DCLUSTER_COORDINATOR=0

; Independent physical panel candidate; serial diagnostic profiles unchanged.
[env:cyd-field]
board = esp32dev
board_build.partitions = huge_app.csv
build_flags = ${env.build_flags} -DCLUSTER_COORDINATOR=1 -DCLUSTER_FIELD=1 -DLGFX_USE_V1
lib_deps =
    lovyan03/LovyanGFX @ 1.2.32
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4

[env:cyd-dual]
extends = env:cyd-field
build_flags = ${env:cyd-field.build_flags} -DCLUSTER_DUAL=1

; Dedicated 0/1/2-node serial benchmark; no display or audio.
[env:cyd-multi]
board = esp32dev
build_src_filter = +<multi_main.cpp>
build_flags = ${env.build_flags} -DCLUSTER_MULTI=1

; Interactive 1024-particle field with optional two-peer compute.
[env:cyd-multi-field]
extends = env:cyd-field
build_src_filter = +<multi_main.cpp>
build_flags = ${env:cyd-field.build_flags} -DCLUSTER_MULTI=1 -DCLUSTER_MULTI_FIELD=1

; Opt-in matched physical replay; normal multi-field firmware unchanged.
[env:cyd-multi-field-bench]
extends = env:cyd-multi-field
build_flags = ${env:cyd-multi-field.build_flags} -DCLUSTER_FIELD_BENCH=1
