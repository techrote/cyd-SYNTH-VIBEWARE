[platformio]
default_envs = cyd-coordinator, s3-worker, c3-worker, cyd-worker

[env]
platform = espressif32 @ 6.10.0
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17

[env:cyd-coordinator]
board = esp32dev
build_flags = ${env.build_flags} -DCLUSTER_COORDINATOR=1

[env:s3-worker]
board = esp32-s3-devkitc-1
build_flags = ${env.build_flags} -DCLUSTER_COORDINATOR=0

[env:c3-worker]
board = esp32-c3-devkitm-1
build_flags = ${env.build_flags} -DCLUSTER_COORDINATOR=0

[env:cyd-worker]
board = esp32dev
build_flags = ${env.build_flags} -DCLUSTER_COORDINATOR=0
