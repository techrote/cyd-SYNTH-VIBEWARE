[platformio]
default_envs = cyd-port-chrono
src_dir = target
[env:cyd-port-chrono]
platform = espressif32 @ 7.1.3
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -O2 -DLGFX_USE_V1
lib_deps =
    lovyan03/LovyanGFX @ 1.2.32
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
